spring.application.name=meditrack-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/meditrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret & Expiry
meditrack.jwt.secret=meditrack-super-secret-jwt-key-2024-secure-256bit-key-for-hmac-sha
meditrack.jwt.expiration=86400000

# File storage path
meditrack.upload.path=uploads/
